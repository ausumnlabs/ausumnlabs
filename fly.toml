# fly.toml app configuration file generated for ausumnlabs-web on 2026-11-16T14:24:30+05:30
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ausumnlabs-web'
primary_region = 'sin'

[build]
[env]
  NEXT_PUBLIC_SITE_URL = 'https://ausumnlabs.in'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
